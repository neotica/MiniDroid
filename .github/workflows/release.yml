name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v0.2.1)"
        required: true
      holomarket_tag:
        description: "HoloMarket release tag (default: latest)"
        required: false
        default: "latest"

permissions:
  contents: write

jobs:
  build-flavor:
    name: Build Release APK (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [ donut ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Cache prebuilt libqemu.so (arm64-v8a)
        id: cache-qemu
        uses: actions/cache@v4
        with:
          path: build-android/out/arm64-v8a/libqemu.so
          key: libqemu-arm64-${{ hashFiles('goldfish/**', 'ref/termux-patches/**', 'scripts/build-android-*.sh', 'scripts/apply-goldfish.sh') }}

      - name: Cache native dependency tarballs
        if: steps.cache-qemu.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            deps-android/tarballs
            qemu-11.1.3.tar.xz
          key: qemu-tarballs-${{ hashFiles('scripts/fetch-android-deps.sh') }}

      - name: Install native build tools (on QEMU cache miss)
        if: steps.cache-qemu.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config bison flex autoconf automake libtool \
            python3-packaging python3-venv python3-pip xz-utils
          python3 -m pip install --user --break-system-packages 'meson>=1.5.0'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build Android arm64-v8a QEMU (libqemu.so)
        if: steps.cache-qemu.outputs.cache-hit != 'true'
        run: |
          ./scripts/fetch-android-deps.sh
          ./scripts/build-android-deps.sh
          ./scripts/build-android-qemu.sh

      - name: Stage libqemu.so into jniLibs
        run: |
          mkdir -p android-app/app/src/main/jniLibs/arm64-v8a
          cp build-android/out/arm64-v8a/libqemu.so android-app/app/src/main/jniLibs/arm64-v8a/libqemu.so

      - name: Cache stock Android 1.6 SDK image
        if: matrix.flavor == 'donut'
        uses: actions/cache@v4
        with:
          path: images/android-1.6_r03-linux.zip
          key: android-1.6-r03-sdk-zip

      - name: Prepare Donut ROM with HoloMarket
        if: matrix.flavor == 'donut'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOLOMARKET_TAG: ${{ inputs.holomarket_tag || 'latest' }}
        run: ./scripts/prepare-donut-rom.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Build ${{ matrix.flavor }} APK
        run: |
          FLAVOR="${{ matrix.flavor }}"
          FLAVOR_CAP="$(printf '%s' "$FLAVOR" | awk '{print toupper(substr($0,1,1)) substr($0,2)}')"
          gradle -p android-app "assemble${FLAVOR_CAP}Debug" --no-daemon

      - name: Stage & verify release APK
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          SRC="android-app/app/build/outputs/apk/${{ matrix.flavor }}/debug/app-${{ matrix.flavor }}-debug.apk"
          mkdir -p dist
          OUT="dist/MiniDroid-${{ matrix.flavor }}-${TAG}-arm64-v8a.apk"
          cp "$SRC" "$OUT"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$BUILD_TOOLS/aapt2" dump badging "$OUT" | grep -E "^package:|application-label:"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$OUT"
          (cd dist && sha256sum "$(basename "$OUT")" > "SHA256SUMS-${{ matrix.flavor }}.txt")

      - name: Upload staged release files
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.flavor }}
          path: dist/*

  publish:
    name: Publish GitHub Release
    needs: build-flavor
    runs-on: ubuntu-latest

    steps:
      - name: Download all flavor release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Combine SHA-256 checksums
        run: |
          cat dist/SHA256SUMS-*.txt > dist/SHA256SUMS.txt
          rm -f dist/SHA256SUMS-*.txt
          cat dist/SHA256SUMS.txt

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
